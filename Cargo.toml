[package]
name = "preflightx"
version = "0.3.1"
edition = "2021"
description = "Pre-flight sanity checks for single-cell RNA-seq fastq pairs: determine assay type, chemistry, species and sex from fastqs"
license = "MIT"
authors = ["Saket Choudhary <saketc@iitb.ac.in>"]
repository = "https://github.com/saketlab/preflightx"
keywords = ["single-cell", "fastq", "10x", "bioinformatics", "qc"]
categories = ["command-line-utilities", "science"]
readme = "README.md"
rust-version = "1.74"

[lib]
name = "preflightx"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
serde_norway = "0.9.42"
rustc-hash = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
dirs = "5.0"
needletail = "0.5"
suppaftp = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
needletail = { version = "0.5", default-features = false, features = ["flate2"] }
wasm-bindgen = "=0.2.114"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
