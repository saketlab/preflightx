[package]
name = "preflightx"
version = "0.1.0"
edition = "2021"
description = "Pre-flight sanity checks for single-cell RNA-seq fastq pairs: determine assay type or chemistry from fastqs"
license = "MIT"
authors = ["Saket Choudhary <saketc@iitb.ac.in>"]
repository = "https://github.com/saketlab/preflightx"
keywords = ["single-cell", "fastq", "10x", "bioinformatics", "qc"]
categories = ["command-line-utilities", "science"]
readme = "README.md"
rust-version = "1.74"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
needletail = "0.5"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
colored = "2.1"
serde_norway = "0.9.42"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
